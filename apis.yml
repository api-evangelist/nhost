apis:
- name: Nhost GraphQL API
  description: >-
    Instant, real-time GraphQL API auto-generated from PostgreSQL database schemas via Hasura. Supports
    queries, mutations, and live subscriptions with row- and column-level role-based access control.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.nhost.io/products/graphql/
  baseURL: https://{subdomain}.nhost.run/v1/graphql
