  - PostgreSQL
  properties:
  - type: Documentation
    url: https://docs.nhost.io/products/graphql/
  - url: graphql/nhost-graphql.md
    type: GraphQL
- name: Nhost Serverless Functions API
  description: >-
    Deploy JavaScript and TypeScript serverless functions as HTTP API endpoints for webhooks, event triggers,
    and custom backend logic. Each file in the functions directory becomes an endpoint, auto-deployed
    via GitHub integration.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.nhost.io/products/functions/
