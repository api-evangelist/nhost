aid: nhost
name: Nhost
description: Nhost is an open-source Firebase alternative that provides a fully managed
  backend platform built on PostgreSQL, GraphQL, and modern open-source tools. Developers
  get instant REST and GraphQL APIs auto-generated from their database schema, along
  with authentication supporting email/password, OAuth, magic links, WebAuthn, and
  one-time passwords. The platform includes S3- compatible file storage with CDN delivery
  and image transformation, serverless functions deployable as HTTP endpoints, and
  real-time GraphQL subscriptions. Nhost also offers a local development CLI, GitHub-based
  automated deployments, an AI toolkit with auto-embeddings and assistants, and managed
  container services—enabling teams to launch production-ready backends without infrastructure
  management.
